<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Deferred deep link flow</title>
  <desc id="description">
    A link moves through a routing layer and opens the intended app content.
  </desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1120" y2="590">
      <stop stop-color="#F0F9FF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1E6091" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <circle cx="1070" cy="92" r="150" fill="#7DD3FC" opacity=".14"/>
  <circle cx="102" cy="574" r="190" fill="#60A5FA" opacity=".10"/>

  <text
    x="72"
    y="88"
    fill="#2563EB"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="19"
    font-weight="700"
    letter-spacing="4"
  >
    DEFERRED DEEP LINK
  </text>
  <text
    x="72"
    y="136"
    fill="#102A43"
    font-family="ui-sans-serif, system-ui, sans-serif"
    font-size="28"
    font-weight="700"
  >
    One link, the right destination.
  </text>

  <g filter="url(#shadow)">
    <rect x="72" y="224" width="280" height="230" rx="28" fill="#FFFFFF"/>
    <rect x="460" y="224" width="280" height="230" rx="28" fill="url(#accent)"/>
    <rect x="848" y="224" width="280" height="230" rx="28" fill="#FFFFFF"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 312h72m-36-36v72" stroke="#2563EB" stroke-width="14"/>
    <path d="M552 328a48 48 0 1 1 96 0c0 38-48 76-48 76s-48-38-48-76Z" stroke="#FFFFFF" stroke-width="12"/>
    <circle cx="600" cy="328" r="14" stroke="#FFFFFF" stroke-width="10"/>
    <rect x="944" y="275" width="88" height="126" rx="18" stroke="#0EA5E9" stroke-width="10"/>
    <path d="M977 377h22" stroke="#0EA5E9" stroke-width="8"/>
    <path d="M370 339h66m-18-18 18 18-18 18M758 339h66m-18-18 18 18-18 18" stroke="#60A5FA" stroke-width="8"/>
  </g>

  <g
    font-family="ui-sans-serif, system-ui, sans-serif"
    font-size="17"
    font-weight="700"
    text-anchor="middle"
  >
    <text x="212" y="424" fill="#334E68">CAMPAIGN LINK</text>
    <text x="600" y="424" fill="#FFFFFF">SMART ROUTER</text>
    <text x="988" y="424" fill="#334E68">APP CONTENT</text>
  </g>

  <g
    fill="#627D98"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="15"
  >
    <text x="72" y="542">01 · TAP</text>
    <text x="460" y="542">02 · RESOLVE</text>
    <text x="848" y="542">03 · ARRIVE</text>
  </g>
</svg>
